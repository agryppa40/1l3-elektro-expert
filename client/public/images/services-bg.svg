<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f7ec;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f0faf2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f5e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22a832;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#22a832;stop-opacity:0.18" />
      <stop offset="70%" style="stop-color:#22a832;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#22a832;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Tło gradientowe -->
  <rect width="1200" height="520" fill="url(#bgGrad)" />

  <!-- Linie siatki energetycznej - poziome -->
  <line x1="0" y1="130" x2="1200" y2="130" stroke="url(#lineGrad)" stroke-width="1"/>
  <line x1="0" y1="260" x2="1200" y2="260" stroke="url(#lineGrad)" stroke-width="1"/>
  <line x1="0" y1="390" x2="1200" y2="390" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Linie pionowe -->
  <line x1="200" y1="0" x2="200" y2="520" stroke="#22a832" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="400" y1="0" x2="400" y2="520" stroke="#22a832" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="600" y1="0" x2="600" y2="520" stroke="#22a832" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="800" y1="0" x2="800" y2="520" stroke="#22a832" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="1000" y1="0" x2="1000" y2="520" stroke="#22a832" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Panel PV - lewy górny -->
  <g transform="translate(60, 40)" opacity="0.07">
    <rect x="0" y="0" width="120" height="80" rx="4" fill="none" stroke="#22a832" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="120" y2="20" stroke="#22a832" stroke-width="1"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#22a832" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#22a832" stroke-width="1"/>
    <line x1="30" y1="0" x2="30" y2="80" stroke="#22a832" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="80" stroke="#22a832" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="80" stroke="#22a832" stroke-width="1"/>
  </g>

  <!-- Panel PV - prawy dolny -->
  <g transform="translate(980, 360)" opacity="0.07">
    <rect x="0" y="0" width="140" height="100" rx="4" fill="none" stroke="#22a832" stroke-width="1.5"/>
    <line x1="0" y1="25" x2="140" y2="25" stroke="#22a832" stroke-width="1"/>
    <line x1="0" y1="50" x2="140" y2="50" stroke="#22a832" stroke-width="1"/>
    <line x1="0" y1="75" x2="140" y2="75" stroke="#22a832" stroke-width="1"/>
    <line x1="35" y1="0" x2="35" y2="100" stroke="#22a832" stroke-width="1"/>
    <line x1="70" y1="0" x2="70" y2="100" stroke="#22a832" stroke-width="1"/>
    <line x1="105" y1="0" x2="105" y2="100" stroke="#22a832" stroke-width="1"/>
  </g>

  <!-- Słońce - prawy górny -->
  <g transform="translate(1080, 50)" opacity="0.08">
    <circle cx="40" cy="40" r="22" fill="none" stroke="#22a832" stroke-width="1.5"/>
    <line x1="40" y1="5" x2="40" y2="14" stroke="#22a832" stroke-width="1.5"/>
    <line x1="40" y1="66" x2="40" y2="75" stroke="#22a832" stroke-width="1.5"/>
    <line x1="5" y1="40" x2="14" y2="40" stroke="#22a832" stroke-width="1.5"/>
    <line x1="66" y1="40" x2="75" y2="40" stroke="#22a832" stroke-width="1.5"/>
    <line x1="13" y1="13" x2="19" y2="19" stroke="#22a832" stroke-width="1.5"/>
    <line x1="61" y1="61" x2="67" y2="67" stroke="#22a832" stroke-width="1.5"/>
    <line x1="67" y1="13" x2="61" y2="19" stroke="#22a832" stroke-width="1.5"/>
    <line x1="13" y1="67" x2="19" y2="61" stroke="#22a832" stroke-width="1.5"/>
  </g>

  <!-- Falownik - środek górny -->
  <g transform="translate(540, 30)" opacity="0.06">
    <rect x="0" y="0" width="60" height="80" rx="6" fill="none" stroke="#22a832" stroke-width="1.5"/>
    <rect x="8" y="12" width="44" height="28" rx="2" fill="none" stroke="#22a832" stroke-width="1"/>
    <path d="M10 55 Q20 45 30 55 Q40 65 50 55" fill="none" stroke="#22a832" stroke-width="1.2"/>
    <line x1="20" y1="68" x2="40" y2="68" stroke="#22a832" stroke-width="1"/>
  </g>

  <!-- Magazyn energii - lewy dolny -->
  <g transform="translate(40, 360)" opacity="0.07">
    <rect x="0" y="0" width="40" height="80" rx="5" fill="none" stroke="#22a832" stroke-width="1.5"/>
    <rect x="12" y="-8" width="16" height="10" rx="2" fill="none" stroke="#22a832" stroke-width="1"/>
    <line x1="8" y1="30" x2="32" y2="30" stroke="#22a832" stroke-width="1"/>
    <line x1="8" y1="50" x2="32" y2="50" stroke="#22a832" stroke-width="1"/>
    <path d="M15 38 L20 32 L20 38 L25 38 L20 44 L20 38 Z" fill="#22a832" opacity="0.3"/>
    <rect x="4" y="4" width="32" height="22" rx="2" fill="#22a832" opacity="0.06"/>
  </g>

  <!-- Obwód elektryczny - prawy środek -->
  <g transform="translate(1100, 200)" opacity="0.07">
    <circle cx="20" cy="20" r="12" fill="none" stroke="#22a832" stroke-width="1.2"/>
    <line x1="32" y1="20" x2="50" y2="20" stroke="#22a832" stroke-width="1.2"/>
    <line x1="50" y1="20" x2="50" y2="50" stroke="#22a832" stroke-width="1.2"/>
    <line x1="50" y1="50" x2="20" y2="50" stroke="#22a832" stroke-width="1.2"/>
    <line x1="20" y1="50" x2="20" y2="32" stroke="#22a832" stroke-width="1.2"/>
    <rect x="10" y="55" width="20" height="12" rx="2" fill="none" stroke="#22a832" stroke-width="1"/>
  </g>

  <!-- Fala sinusoidalna AC - środek dolny -->
  <g transform="translate(300, 440)" opacity="0.08">
    <path d="M0 20 Q15 0 30 20 Q45 40 60 20 Q75 0 90 20 Q105 40 120 20 Q135 0 150 20 Q165 40 180 20 Q195 0 210 20 Q225 40 240 20" fill="none" stroke="#22a832" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="-15" y2="20" stroke="#22a832" stroke-width="1.2"/>
    <line x1="240" y1="20" x2="255" y2="20" stroke="#22a832" stroke-width="1.2"/>
  </g>

  <!-- Kropki węzłów sieci -->
  <circle cx="200" cy="130" r="4" fill="#22a832" opacity="0.1"/>
  <circle cx="400" cy="260" r="4" fill="#22a832" opacity="0.1"/>
  <circle cx="600" cy="130" r="4" fill="#22a832" opacity="0.1"/>
  <circle cx="800" cy="390" r="4" fill="#22a832" opacity="0.1"/>
  <circle cx="1000" cy="260" r="4" fill="#22a832" opacity="0.1"/>
  <circle cx="200" cy="390" r="3" fill="#22a832" opacity="0.08"/>
  <circle cx="600" cy="390" r="3" fill="#22a832" opacity="0.08"/>
  <circle cx="1000" cy="130" r="3" fill="#22a832" opacity="0.08"/>

  <!-- Linie łączące węzły -->
  <line x1="200" y1="130" x2="400" y2="260" stroke="#22a832" stroke-width="0.8" stroke-opacity="0.07"/>
  <line x1="400" y1="260" x2="600" y2="130" stroke="#22a832" stroke-width="0.8" stroke-opacity="0.07"/>
  <line x1="600" y1="130" x2="800" y2="390" stroke="#22a832" stroke-width="0.8" stroke-opacity="0.07"/>
  <line x1="800" y1="390" x2="1000" y2="260" stroke="#22a832" stroke-width="0.8" stroke-opacity="0.07"/>

  <!-- Delikatny gradient overlay na dole -->
  <rect x="0" y="400" width="1200" height="120" fill="url(#bgGrad)" opacity="0.4"/>
</svg>
